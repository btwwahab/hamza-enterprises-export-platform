<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9edf3"/>
      <stop offset="100%" stop-color="#c7d0dc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <ellipse cx="400" cy="425" rx="290" ry="24" fill="#0f172a" opacity="0.12"/>

  <!-- rear body -->
  <path d="M370 250 L500 250 Q520 250 520 272 L520 355 L360 355 L360 270 Q360 250 370 250 Z" fill="#ff5a1f"/>
  <!-- cab -->
  <rect x="390" y="185" width="110" height="80" rx="10" fill="#ff5a1f"/>
  <rect x="402" y="197" width="86" height="50" rx="6" fill="#8fd3ff" stroke="#13161f" stroke-width="3"/>
  <!-- exhaust -->
  <rect x="495" y="205" width="14" height="45" rx="6" fill="#20242c"/>

  <!-- articulation joint -->
  <rect x="330" y="300" width="40" height="34" rx="8" fill="#4b5563"/>

  <!-- front frame + lift arms -->
  <path d="M200 330 L340 315 L340 335 L210 350 Z" fill="#4b5563"/>
  <path d="M215 260 L335 300 L335 320 L205 285 Z" fill="#6b7280"/>

  <!-- bucket -->
  <path d="M120 300 L215 260 L235 300 L210 350 L130 350 Z" fill="#20242c"/>
  <path d="M120 300 L210 265 L215 275 L128 312 Z" fill="#3a3f4a"/>

  <!-- wheels -->
  <circle cx="245" cy="368" r="42" fill="#13161f"/>
  <circle cx="245" cy="368" r="18" fill="#5a6172"/>
  <circle cx="470" cy="368" r="42" fill="#13161f"/>
  <circle cx="470" cy="368" r="18" fill="#5a6172"/>

  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5a6172" letter-spacing="2">WHEEL LOADER</text>
</svg>
