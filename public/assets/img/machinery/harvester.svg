<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf1e8"/>
      <stop offset="100%" stop-color="#cddccb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <ellipse cx="420" cy="425" rx="300" ry="22" fill="#0f172a" opacity="0.12"/>

  <!-- grain tank / body -->
  <rect x="380" y="255" width="180" height="95" rx="14" fill="#2f8f3f"/>
  <!-- cab -->
  <rect x="330" y="230" width="70" height="90" rx="8" fill="#20242c"/>
  <rect x="340" y="240" width="50" height="45" rx="5" fill="#8fd3ff" opacity="0.65"/>

  <!-- unloading auger -->
  <path d="M520 270 L610 190" stroke="#4b5563" stroke-width="14" stroke-linecap="round"/>

  <!-- header / cutting table -->
  <path d="M170 330 L330 300 L330 350 L190 365 Z" fill="#ffb020"/>
  <rect x="170" y="325" width="20" height="45" fill="#c68a10"/>
  <line x1="200" y1="333" x2="200" y2="360" stroke="#c68a10" stroke-width="4"/>
  <line x1="230" y1="329" x2="230" y2="357" stroke="#c68a10" stroke-width="4"/>
  <line x1="260" y1="325" x2="260" y2="353" stroke="#c68a10" stroke-width="4"/>
  <line x1="290" y1="320" x2="290" y2="349" stroke="#c68a10" stroke-width="4"/>

  <!-- rear wheel small -->
  <circle cx="540" cy="378" r="30" fill="#13161f"/>
  <circle cx="540" cy="378" r="13" fill="#5a6172"/>

  <!-- front big wheel -->
  <circle cx="400" cy="392" r="46" fill="#13161f"/>
  <circle cx="400" cy="392" r="20" fill="#5a6172"/>

  <text x="410" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6350" letter-spacing="2">COMBINE HARVESTER</text>
</svg>
