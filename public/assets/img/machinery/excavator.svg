<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9edf3"/>
      <stop offset="100%" stop-color="#c7d0dc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <ellipse cx="400" cy="430" rx="300" ry="24" fill="#0f172a" opacity="0.12"/>

  <!-- tracks -->
  <rect x="150" y="360" width="360" height="55" rx="27" fill="#20242c"/>
  <circle cx="185" cy="387" r="24" fill="#3a3f4a"/>
  <circle cx="255" cy="395" r="18" fill="#3a3f4a"/>
  <circle cx="325" cy="395" r="18" fill="#3a3f4a"/>
  <circle cx="395" cy="395" r="18" fill="#3a3f4a"/>
  <circle cx="460" cy="387" r="24" fill="#3a3f4a"/>

  <!-- undercarriage frame -->
  <rect x="190" y="345" width="290" height="24" rx="6" fill="#4b5563"/>

  <!-- house / cab body -->
  <path d="M240 345 L240 260 Q240 240 262 240 L430 240 Q460 240 468 268 L480 345 Z" fill="#ff5a1f"/>
  <path d="M240 260 L240 345 L275 345 L275 260 Z" fill="#dd4a14"/>

  <!-- cab window -->
  <rect x="255" y="255" width="80" height="55" rx="8" fill="#8fd3ff"/>
  <rect x="255" y="255" width="80" height="55" rx="8" fill="none" stroke="#13161f" stroke-width="3"/>

  <!-- counterweight -->
  <rect x="430" y="270" width="45" height="70" rx="8" fill="#13161f"/>

  <!-- boom -->
  <path d="M300 250 L420 130 L450 138 L345 258 Z" fill="#4b5563"/>
  <!-- stick -->
  <path d="M420 132 L500 220 L478 234 L400 150 Z" fill="#6b7280"/>
  <!-- bucket -->
  <path d="M495 215 L545 235 L540 268 L500 278 L480 250 Z" fill="#20242c"/>
  <path d="M540 268 L500 278 L505 288 L542 280 Z" fill="#13161f"/>

  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5a6172" letter-spacing="2">HYDRAULIC EXCAVATOR</text>
</svg>
