<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9edf3"/>
      <stop offset="100%" stop-color="#c7d0dc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <ellipse cx="420" cy="425" rx="300" ry="24" fill="#0f172a" opacity="0.12"/>

  <!-- hook line -->
  <line x1="640" y1="90" x2="640" y2="300" stroke="#5a6172" stroke-width="3"/>
  <path d="M632 300 q-10 20 8 28 q18 -8 8 -28 Z" fill="#20242c"/>

  <!-- boom -->
  <path d="M300 340 L655 90 L668 100 L318 352 Z" fill="#4b5563"/>
  <path d="M655 90 L670 96 L664 108 L649 102 Z" fill="#ff5a1f"/>

  <!-- truck chassis -->
  <rect x="150" y="340" width="420" height="26" rx="6" fill="#20242c"/>

  <!-- cab -->
  <path d="M175 300 L245 300 L245 340 L165 340 L165 320 Q165 300 175 300 Z" fill="#ff5a1f"/>
  <rect x="182" y="308" width="45" height="26" rx="5" fill="#8fd3ff" stroke="#13161f" stroke-width="2.5"/>

  <!-- body / turret -->
  <path d="M255 340 L255 290 L420 290 Q440 290 440 310 L440 340 Z" fill="#ff5a1f"/>
  <rect x="270" y="300" width="60" height="34" rx="6" fill="#8fd3ff" stroke="#13161f" stroke-width="2.5"/>

  <!-- outriggers -->
  <rect x="245" y="360" width="10" height="30" fill="#4b5563"/>
  <rect x="500" y="360" width="10" height="30" fill="#4b5563"/>

  <!-- wheels -->
  <circle cx="215" cy="368" r="26" fill="#13161f"/>
  <circle cx="215" cy="368" r="11" fill="#5a6172"/>
  <circle cx="300" cy="368" r="26" fill="#13161f"/>
  <circle cx="300" cy="368" r="11" fill="#5a6172"/>
  <circle cx="470" cy="368" r="26" fill="#13161f"/>
  <circle cx="470" cy="368" r="11" fill="#5a6172"/>
  <circle cx="545" cy="368" r="26" fill="#13161f"/>
  <circle cx="545" cy="368" r="11" fill="#5a6172"/>

  <text x="410" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5a6172" letter-spacing="2">MOBILE CRANE</text>
</svg>
