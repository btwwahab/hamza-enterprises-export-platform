<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9edf3"/>
      <stop offset="100%" stop-color="#c7d0dc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <ellipse cx="410" cy="420" rx="240" ry="22" fill="#0f172a" opacity="0.12"/>

  <!-- body -->
  <rect x="350" y="290" width="150" height="90" rx="12" fill="#ff5a1f"/>
  <!-- counterweight -->
  <rect x="470" y="310" width="45" height="80" rx="8" fill="#13161f"/>
  <!-- cab -->
  <rect x="365" y="225" width="90" height="70" rx="8" fill="none" stroke="#13161f" stroke-width="6"/>
  <rect x="372" y="232" width="76" height="56" rx="4" fill="#8fd3ff" opacity="0.55"/>
  <!-- seat -->
  <rect x="390" y="270" width="35" height="20" rx="4" fill="#20242c"/>

  <!-- mast -->
  <rect x="298" y="180" width="10" height="210" fill="#4b5563"/>
  <rect x="322" y="180" width="10" height="210" fill="#4b5563"/>
  <rect x="298" y="230" width="34" height="10" fill="#6b7280"/>

  <!-- carriage + forks -->
  <rect x="290" y="330" width="45" height="14" fill="#20242c"/>
  <rect x="250" y="336" width="90" height="10" fill="#13161f"/>
  <rect x="250" y="352" width="90" height="10" fill="#13161f"/>

  <!-- load pallet -->
  <rect x="180" y="300" width="75" height="46" rx="4" fill="#c68a4e"/>
  <rect x="180" y="300" width="75" height="46" rx="4" fill="none" stroke="#8a5a2b" stroke-width="3"/>

  <!-- wheels -->
  <circle cx="380" cy="392" r="30" fill="#13161f"/>
  <circle cx="380" cy="392" r="13" fill="#5a6172"/>
  <circle cx="470" cy="392" r="26" fill="#13161f"/>
  <circle cx="470" cy="392" r="11" fill="#5a6172"/>

  <text x="380" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5a6172" letter-spacing="2">FORKLIFT</text>
</svg>
